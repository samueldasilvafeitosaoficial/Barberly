	<script>const STORAGE_KEY = 'barberly-data-v1';
const today = new Date().toISOString().slice(0, 10);
const initialData = { appointments: [], clients: [], services: [{ id: 1, name: 'Corte masculino', duration: '40 min', price: 40 }, { id: 2, name: 'Barba', duration: '30 min', price: 25 }, { id: 3, name: 'Corte + barba', duration: '60 min', price: 60 }], team: [], transactions: [], products: [], settings: { returnDays: 15, shopName: 'Oficina Central', whatsapp: '' } };
let data = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || initialData;
const esc = (value = '') => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
const money = value => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0);
const initials = name => name.split(' ').map(word => word[0]).slice(0, 2).join('').toUpperCase();
const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
const showToast = message => { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2800); };
const formatDate = value => value ? new Date(`${value}T12:00:00`).toLocaleDateString('pt-BR') : '-';
const icon = name => `<i data-lucide="${name}"></i>`;
function refreshIcons() { if (window.lucide) lucide.createIcons(); }
function setView(view) { document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.view === view)); document.getElementById('pageTitle').textContent = ({ dashboard: 'Início', agenda: 'Agenda', clientes: 'Clientes', servicos: 'Serviços', equipe: 'Equipe', financeiro: 'Financeiro', produtos: 'Produtos', retornos: 'Retornos', mensagens: 'Mensagens', configuracoes: 'Configurações' })[view]; render(view); document.getElementById('sidebar').classList.remove('open'); }
function render(view = 'dashboard') { const container = document.getElementById('viewContainer'); const screens = { dashboard: renderDashboard, agenda: renderAgenda, clientes: renderClients, servicos: renderServices, equipe: renderTeam, financeiro: renderFinance, produtos: renderProducts, retornos: renderReturns, mensagens: renderMessages, configuracoes: renderSettings }; container.innerHTML = screens[view](); refreshIcons(); bindView(view); }
function pageHead(label, title, description, button = '') { return `<div class="page-head"><div><p class="eyebrow">${label}</p><h1>${title}</h1><p>${description}</p></div>${button}</div>`; }
function renderDashboard() { const income = data.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.value), 0); const appointments = data.appointments.length; return pageHead('Sábado, 23 de agosto de 2026', 'Bom dia, Marina', 'Aqui está o que está acontecendo na sua barbearia hoje.', `<button class="primary-button" data-modal="appointment">${icon('plus')}Novo agendamento</button>`) + `<div class="stats-grid"><div class="stat-card"><div class="stat-top">Agendamentos hoje <span class="stat-icon">${icon('calendar-check')}</span></div><div class="stat-value">${appointments}</div><span class="stat-change">${appointments ? 'Dados persistidos' : 'Nenhum agendamento ainda'}</span></div><div class="stat-card"><div class="stat-top">Faturamento no mês <span class="stat-icon green">${icon('banknote')}</span></div><div class="stat-value">${money(income)}</div><span class="stat-change">Atualizado em tempo real</span></div><div class="stat-card"><div class="stat-top">Clientes cadastrados <span class="stat-icon yellow">${icon('users')}</span></div><div class="stat-value">${data.clients.length}</div><span class="stat-change">Na sua base</span></div><div class="stat-card"><div class="stat-top">Retornos pendentes <span class="stat-icon gray">${icon('refresh-cw')}</span></div><div class="stat-value">${data.clients.filter(c => c.returnDate && c.returnDate <= today).length}</div><span class="stat-change down">Precisam de atenção</span></div></div><div class="dashboard-grid"><section class="panel"><div class="panel-heading"><h2>Movimento da semana</h2><button class="text-button">Últimos 7 dias ${icon('chevron-down')}</button></div><div class="chart-area"><svg viewBox="0 0 600 180" preserveAspectRatio="none"><path d="M0 145 C50 140 60 112 110 125 S165 80 215 105 S270 90 315 98 S380 48 425 73 S475 35 520 61 S570 35 600 25" fill="none" stroke="#e56b3f" stroke-width="3"/><path d="M0 145 C50 140 60 112 110 125 S165 80 215 105 S270 90 315 98 S380 48 425 73 S475 35 520 61 S570 35 600 25 L600 180 L0 180Z" fill="#e56b3f" opacity=".08"/></svg></div><div class="chart-labels"><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span><span>Dom</span></div></section><section class="panel"><div class="panel-heading"><h2>Próximos horários</h2><button class="text-button" data-view-link="agenda">Ver agenda ${icon('arrow-up-right')}</button></div><div class="appointment-list">${data.appointments.length ? data.appointments.slice(0, 4).map(appointmentRow).join('') : `<div class="empty-state">${icon('calendar-plus')}<b>Agenda livre por enquanto</b><span>Crie o primeiro horário para começar.</span></div>`}</div></section></div>`; }
function appointmentRow(item) { return `<div class="appointment"><span class="time">${esc(item.time)}</span><span class="person-avatar">${initials(esc(item.client))}</span><div class="appointment-info"><b>${esc(item.client)}</b><small>${esc(item.service)} · ${esc(item.employee || 'Profissional')}</small></div><span class="status ${item.status === 'Pendente' ? 'pending' : ''}">${esc(item.status || 'Agendado')}</span></div>`; }
function renderAgenda() { return pageHead('Operação', 'Agenda', 'Acompanhe seus horários e mantenha o dia no ritmo.', `<button class="primary-button" data-modal="appointment">${icon('plus')}Novo agendamento</button>`) + `<div class="toolbar"><div class="search-box">${icon('search')}<input placeholder="Buscar na agenda..." id="agendaSearch"></div><select class="filter-select"><option>Hoje, 23 ago</option><option>Amanhã</option><option>Esta semana</option></select><button class="subtle-button">${icon('sliders-horizontal')}Filtros</button></div><section class="panel"><div class="panel-heading"><h2>Hoje, 23 de agosto <span class="muted">· ${data.appointments.length} horários</span></h2><div class="button-row"><button class="subtle-button">${icon('list')}Lista</button><button class="subtle-button">${icon('layout-grid')}Semana</button></div></div><div class="appointment-list">${data.appointments.length ? data.appointments.map(appointmentRow).join('') : `<div class="empty-state">${icon('calendar-off')}<b>Nenhum agendamento encontrado</b><span>Os novos horários aparecerão aqui.</span></div>`}</div></section>`; }
function renderClients() { return pageHead('Relacionamento', 'Clientes', 'Uma visão clara de quem mantém sua cadeira ocupada.', `<button class="primary-button" data-modal="client">${icon('plus')}Adicionar cliente</button>`) + `<div class="toolbar"><div class="search-box">${icon('search')}<input placeholder="Buscar por nome, telefone ou e-mail"></div><select class="filter-select"><option>Todos os clientes</option><option>Ativos</option><option>Em risco</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Cliente</th><th>Última visita</th><th>Retorno recomendado</th><th>Visitas</th><th>Status</th></tr></thead><tbody>${data.clients.length ? data.clients.map(c => `<tr><td><div class="table-person"><span class="person-avatar">${initials(esc(c.name))}</span><b>${esc(c.name)}</b></div></td><td>${formatDate(c.lastVisit)}</td><td>${formatDate(c.returnDate)}</td><td>${c.visits || 0}</td><td><span class="status ${c.returnDate && c.returnDate <= today ? 'pending' : ''}">${c.returnDate && c.returnDate <= today ? 'Retorno pendente' : 'Em dia'}</span></td></tr>`).join('') : `<tr><td colspan="5"><div class="empty-state">${icon('users')}<b>Nenhum cliente cadastrado</b><span>Adicione clientes reais à sua base.</span></div></td></tr>`}</tbody></table></div>`; }
function renderServices() { return pageHead('Operação', 'Serviços', 'Defina sua carta de serviços, duração e retorno recomendado.', `<button class="primary-button" data-modal="service">${icon('plus')}Novo serviço</button>`) + `<div class="card-grid">${data.services.map(s => `<article class="service-card"><span class="stat-icon">${icon('scissors')}</span><h3>${esc(s.name)}</h3><p>Intervalo recomendado para retorno da manutenção.</p><div class="card-meta"><span>${esc(s.duration)}</span><span>${money(s.price)}</span></div></article>`).join('')}</div>`; }
function renderTeam() { return pageHead('Operação', 'Equipe', 'Profissionais, especialidades e comissões em um só lugar.', `<button class="primary-button" data-modal="team">${icon('plus')}Adicionar profissional</button>`) + `<div class="card-grid">${data.team.length ? data.team.map(t => `<article class="service-card"><span class="person-avatar">${initials(esc(t.name))}</span><h3>${esc(t.name)}</h3><p>${esc(t.role || 'Barbeiro')} · ${esc(t.specialty || 'Especialista')}</p><div class="card-meta"><span>Comissão</span><span>${esc(t.commission || '40%')}</span></div></article>`).join('') : `<section class="panel empty-state">${icon('user-round-plus')}<b>Nenhum profissional cadastrado</b><span>Monte sua equipe para liberar a agenda por profissional.</span></section>`}</div>`; }
function renderFinance() { const income = data.transactions.filter(t => t.type === 'income').reduce((s, t) => s + Number(t.value), 0); const expense = data.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + Number(t.value), 0); return pageHead('Gestão financeira', 'Financeiro', 'Acompanhe entradas, despesas e o resultado do seu negócio.', `<button class="primary-button" data-modal="transaction">${icon('plus')}Novo lançamento</button>`) + `<div class="stats-grid"><div class="stat-card"><div class="stat-top">Receitas <span class="stat-icon green">${icon('trending-up')}</span></div><div class="stat-value">${money(income)}</div></div><div class="stat-card"><div class="stat-top">Despesas <span class="stat-icon yellow">${icon('trending-down')}</span></div><div class="stat-value">${money(expense)}</div></div><div class="stat-card"><div class="stat-top">Resultado <span class="stat-icon">${icon('arrow-up-right')}</span></div><div class="stat-value">${money(income - expense)}</div></div><div class="stat-card"><div class="stat-top">Ticket médio <span class="stat-icon gray">${icon('receipt')}</span></div><div class="stat-value">${money(data.appointments.length ? income / data.appointments.length : 0)}</div></div></div><section class="panel"><div class="panel-heading"><h2>Lançamentos recentes</h2><button class="subtle-button">${icon('download')}Exportar</button></div>${data.transactions.length ? `<div class="table-wrap"><table class="data-table"><thead><tr><th>Descrição</th><th>Tipo</th><th>Data</th><th>Valor</th></tr></thead><tbody>${data.transactions.map(t => `<tr><td><b>${esc(t.description)}</b></td><td><span class="status ${t.type === 'expense' ? 'cancelled' : ''}">${t.type === 'income' ? 'Receita' : 'Despesa'}</span></td><td>${formatDate(t.date)}</td><td class="metric-highlight">${money(t.value)}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty-state">${icon('wallet')}<b>Nenhum lançamento ainda</b><span>Registre a primeira entrada ou despesa.</span></div>`}</section>`; }
function renderProducts() { return pageHead('Comercial', 'Produtos indicados', 'Crie uma vitrine simples para recomendar o cuidado em casa.', `<button class="primary-button" data-modal="product">${icon('plus')}Adicionar produto</button>`) + `<div class="card-grid">${data.products.length ? data.products.map(p => `<article class="product-card"><div class="product-art">${icon('package-open')}</div><h3>${esc(p.name)}</h3><p>${esc(p.description || 'Produto recomendado pela equipe.')}</p><div class="card-meta"><span>${esc(p.category || 'Cuidados')}</span><span>${money(p.price)}</span></div></article>`).join('') : `<section class="panel empty-state">${icon('package-plus')}<b>Nenhum produto cadastrado</b><span>Adicione produtos para exibir na área do cliente.</span></section>`}</div>`; }
function renderReturns() { const pending = data.clients.filter(c => c.returnDate); return pageHead('Relacionamento', 'Retornos', 'O momento certo de convidar cada cliente para voltar.', `<button class="primary-button" data-view-link="clientes">${icon('users')}Ver clientes</button>`) + `<div class="notice">${icon('info')} O intervalo padrão está configurado para ${data.settings.returnDays} dias após o atendimento. Você pode ajustar isso em Configurações.</div><section class="panel"><div class="panel-heading"><h2>Clientes para retornar</h2><span class="status pending">${pending.length} pendentes</span></div><div class="return-list">${pending.length ? pending.map(c => `<div class="return-item"><span class="person-avatar">${initials(esc(c.name))}</span><div class="return-copy"><b>${esc(c.name)}</b><small>Última visita em ${formatDate(c.lastVisit)}</small></div><span class="return-date">${formatDate(c.returnDate)}</span><button class="icon-button" aria-label="Enviar mensagem">${icon('send')}</button></div>`).join('') : `<div class="empty-state">${icon('sparkles')}<b>Nenhum retorno calculado</b><span>Ao concluir atendimentos, os retornos aparecerão aqui.</span></div>`}</div></section>`; }
function renderMessages() { return pageHead('Relacionamento', 'Mensagens', 'Prepare seus lembretes e acompanhe os próximos contatos.', `<button class="primary-button" data-modal="message">${icon('plus')}Nova mensagem</button>`) + `<section class="panel"><div class="panel-heading"><h2>Automação de retorno</h2><span class="status pending">Configuração necessária</span></div><div class="notice">${icon('message-circle')} Conecte a API oficial do WhatsApp em um backend para enviar mensagens reais. Este painel não simula envios.</div><div class="form-row"><div class="field"><label>Mensagem de retorno</label><textarea id="messageTemplate">Olá, {{nome}}! Já está na hora de voltar à {{barbearia}}. Clique aqui para reservar seu horário.</textarea></div><div class="field"><label>Disparo</label><select><option>15 dias após a última visita</option><option>7 dias após a última visita</option><option>30 dias após a última visita</option></select></div></div><button class="primary-button" id="saveMessage">${icon('save')}Salvar modelo</button></section>`; }
function renderSettings() { return pageHead('Administração', 'Configurações', 'Personalize as regras que fazem sua operação funcionar.', `<button class="primary-button" id="saveSettings">${icon('save')}Salvar alterações</button>`) + `<div class="settings-grid"><div class="settings-nav"><button class="active">Estabelecimento</button><button>Agenda e retorno</button><button>Notificações</button><button>Integrações</button></div><section class="panel settings-form"><div class="form-row"><div class="field"><label>Nome da barbearia</label><input id="shopName" value="${esc(data.settings.shopName)}"></div><div class="field"><label>WhatsApp comercial</label><input id="shopWhatsapp" placeholder="(11) 99999-9999" value="${esc(data.settings.whatsapp)}"></div></div><div class="field"><label>Intervalo padrão de retorno (dias)</label><input id="returnDays" type="number" min="1" value="${data.settings.returnDays}"></div><div class="field"><label>Descrição</label><textarea placeholder="Conte um pouco sobre o seu espaço"></textarea></div><p class="muted">Fuso horário: America/Sao_Paulo · Moeda: BRL</p></section></div>`; }
function modal(type) { const forms = { client: ['Adicionar cliente', `<div class="field"><label>Nome completo</label><input id="f-name" required placeholder="Ex.: João da Silva"></div><div class="form-row"><div class="field"><label>Telefone</label><input id="f-phone" placeholder="(11) 99999-9999"></div><div class="field"><label>E-mail</label><input id="f-email" type="email"></div></div>`], appointment: ['Novo agendamento', `<div class="form-row"><div class="field"><label>Cliente</label><input id="f-client" required placeholder="Nome do cliente"></div><div class="field"><label>Horário</label><input id="f-time" type="time" value="09:00"></div></div><div class="form-row"><div class="field"><label>Serviço</label><select id="f-service">${data.services.map(s => `<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Profissional</label><input id="f-employee" placeholder="Nome do barbeiro"></div></div>`], service: ['Novo serviço', `<div class="field"><label>Nome do serviço</label><input id="f-service-name" required placeholder="Ex.: Corte masculino"></div><div class="form-row"><div class="field"><label>Duração</label><input id="f-duration" placeholder="40 min"></div><div class="field"><label>Preço (R$)</label><input id="f-price" type="number" min="0" step="0.01"></div></div>`], team: ['Adicionar profissional', `<div class="field"><label>Nome completo</label><input id="f-team-name" required placeholder="Ex.: Lucas Oliveira"></div><div class="form-row"><div class="field"><label>Especialidade</label><input id="f-specialty" placeholder="Corte e barba"></div><div class="field"><label>Comissão</label><input id="f-commission" placeholder="40%"></div></div>`], transaction: ['Novo lançamento', `<div class="field"><label>Descrição</label><input id="f-description" required placeholder="Ex.: Atendimento corte"></div><div class="form-row"><div class="field"><label>Tipo</label><select id="f-type"><option value="income">Receita</option><option value="expense">Despesa</option></select></div><div class="field"><label>Valor (R$)</label><input id="f-value" type="number" min="0" step="0.01" required></div></div>`], product: ['Adicionar produto', `<div class="field"><label>Nome do produto</label><input id="f-product-name" required placeholder="Ex.: Pomada modeladora"></div><div class="form-row"><div class="field"><label>Categoria</label><input id="f-category" placeholder="Finalização"></div><div class="field"><label>Preço (R$)</label><input id="f-product-price" type="number" min="0" step="0.01"></div></div><div class="field"><label>Descrição curta</label><textarea id="f-product-description"></textarea></div>`] }; const form = forms[type] || forms.client; return `<div class="modal-backdrop" id="modal"><form class="modal" id="modalForm" data-type="${type}"><div class="modal-head"><div><h2>${form[0]}</h2><p>Preencha os dados para salvar no seu espaço.</p></div><button type="button" class="modal-close" aria-label="Fechar">${icon('x')}</button></div>${form[1]}<button class="primary-button" type="submit">${icon('check')}Salvar registro</button></form></div>`; }
function bindView(view) { document.querySelectorAll('[data-modal]').forEach(btn => btn.onclick = () => { document.getElementById('modalRoot').innerHTML = modal(btn.dataset.modal); refreshIcons(); bindModal(); }); document.querySelectorAll('[data-view-link]').forEach(btn => btn.onclick = () => setView(btn.dataset.viewLink)); if (view === 'configuracoes') document.getElementById('saveSettings').onclick = () => { data.settings.shopName = document.getElementById('shopName').value; data.settings.whatsapp = document.getElementById('shopWhatsapp').value; data.settings.returnDays = Number(document.getElementById('returnDays').value) || 15; save(); showToast('Configurações salvas.'); }; if (view === 'mensagens') document.getElementById('saveMessage').onclick = () => showToast('Modelo salvo para configuração do provedor.'); }
function bindModal() { const modalElement = document.getElementById('modal'); document.querySelector('.modal-close').onclick = () => modalElement.remove(); document.getElementById('modalForm').onsubmit = event => { event.preventDefault(); const type = event.currentTarget.dataset.type; if (type === 'client') { const name = document.getElementById('f-name').value.trim(); data.clients.push({ id: Date.now(), name, phone: document.getElementById('f-phone').value, lastVisit: today, returnDate: new Date(Date.now() + data.settings.returnDays * 86400000).toISOString().slice(0, 10), visits: 0 }); showToast('Cliente adicionado.'); } if (type === 'appointment') { const client = document.getElementById('f-client').value.trim(); data.appointments.push({ id: Date.now(), client, time: document.getElementById('f-time').value, service: document.getElementById('f-service').value, employee: document.getElementById('f-employee').value, status: 'Agendado' }); showToast('Agendamento criado.'); } if (type === 'service') { data.services.push({ id: Date.now(), name: document.getElementById('f-service-name').value, duration: document.getElementById('f-duration').value || '30 min', price: Number(document.getElementById('f-price').value) || 0 }); showToast('Serviço cadastrado.'); } if (type === 'team') { data.team.push({ id: Date.now(), name: document.getElementById('f-team-name').value, specialty: document.getElementById('f-specialty').value, commission: document.getElementById('f-commission').value || '40%' }); showToast('Profissional adicionado.'); } if (type === 'transaction') { data.transactions.push({ id: Date.now(), description: document.getElementById('f-description').value, type: document.getElementById('f-type').value, value: Number(document.getElementById('f-value').value), date: today }); showToast('Lançamento registrado.'); } if (type === 'product') { data.products.push({ id: Date.now(), name: document.getElementById('f-product-name').value, category: document.getElementById('f-category').value, price: Number(document.getElementById('f-product-price').value), description: document.getElementById('f-product-description').value }); showToast('Produto cadastrado.'); } save(); modalElement.remove(); setView(document.querySelector('.nav-item.active').dataset.view); }; }
document.querySelectorAll('.nav-item').forEach(item => item.onclick = () => setView(item.dataset.view)); document.getElementById('menuToggle').onclick = () => document.getElementById('sidebar').classList.toggle('open'); render();

const supabaseReady = window.supabase && window.BARBERLY_SUPABASE_URL && window.BARBERLY_SUPABASE_ANON_KEY && !window.BARBERLY_SUPABASE_URL.includes('your-project');
const supabaseClient = supabaseReady ? supabase.createClient(window.BARBERLY_SUPABASE_URL, window.BARBERLY_SUPABASE_ANON_KEY) : null;
function renderAuth(mode = 'login', message = '') { const isLogin = mode === 'login'; document.querySelector('.app-shell').style.display = 'none'; const root = document.getElementById('authRoot'); root.innerHTML = `<main class="auth-screen"><section class="auth-intro"><div class="brand"><span class="brand-mark">B</span><span>barberly</span></div><div><h1>Mais tempo na cadeira. Menos tempo na planilha.</h1><p>Organize a operação da sua barbearia e construa relacionamentos que fazem seus clientes voltarem.</p></div><div class="auth-quote">Gestão simples para espaços que cuidam de cada detalhe.</div></section><section class="auth-panel"><div class="auth-box"><p class="eyebrow">Área do cliente</p><h2>${isLogin ? 'Bem-vindo de volta' : 'Crie sua conta'}</h2><p>${isLogin ? 'Entre para consultar e agendar seu próximo horário.' : 'Cadastre-se para agendar na sua barbearia.'}</p><button class="google-button" id="googleLogin"><span class="google-mark">G</span>Continuar com Google</button><div class="auth-divider">ou use seu e-mail</div><form id="authForm" data-mode="${mode}"><div class="field"><label for="authEmail">E-mail</label><input id="authEmail" type="email" required autocomplete="email" placeholder="voce@email.com"></div><div class="field"><label for="authPassword">Senha</label><input id="authPassword" type="password" required minlength="8" autocomplete="${isLogin ? 'current-password' : 'new-password'}" placeholder="Mínimo de 8 caracteres"></div><button class="primary-button auth-submit" type="submit">${isLogin ? 'Entrar' : 'Criar conta'}</button></form><div class="auth-message ${message ? 'show' : ''}" id="authMessage">${esc(message)}</div><p class="auth-config">${supabaseReady ? (isLogin ? 'Ainda não tem acesso? ' : 'Já possui uma conta? ') + `<button type="button" class="auth-switch" id="authSwitch">${isLogin ? 'Criar conta' : 'Entrar'}</button>` : 'A autenticação será habilitada após a configuração do provedor.'}</p></div></section></main>`; refreshIcons(); if (!supabaseReady) { document.getElementById('authForm').querySelector('button').disabled = true; document.getElementById('googleLogin').disabled = true; } else { document.getElementById('authForm').onsubmit = handlePasswordAuth; document.getElementById('googleLogin').onclick = handleGoogleAuth; document.getElementById('authSwitch').onclick = () => renderAuth(isLogin ? 'register' : 'login'); } }
async function handlePasswordAuth(event) { event.preventDefault(); const form = event.currentTarget; const button = form.querySelector('button'); button.disabled = true; const email = document.getElementById('authEmail').value; const password = document.getElementById('authPassword').value; const response = form.dataset.mode === 'register' ? await supabaseClient.auth.signUp({ email, password }) : await supabaseClient.auth.signInWithPassword({ email, password }); button.disabled = false; if (response.error) { renderAuth(form.dataset.mode, response.error.message); return; } if (response.data.session) showApp(); else renderAuth('login', 'Verifique seu e-mail para ativar a conta.'); }
async function handleGoogleAuth() { const { error } = await supabaseClient.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); if (error) renderAuth('login', error.message); }
function showApp() { document.getElementById('authRoot').innerHTML = ''; document.querySelector('.app-shell').style.display = 'flex'; }
async function initAuth() { if (!supabaseReady) { renderAuth(); return; } const { data: { session } } = await supabaseClient.auth.getSession(); if (session) showApp(); else renderAuth(); supabaseClient.auth.onAuthStateChange((_event, currentSession) => { if (currentSession) showApp(); else renderAuth(); }); }
initAuth();

const addAuthSwitch = () => {
	const config = document.querySelector('.auth-config');
	if (!config || document.getElementById('authSwitch')) return;
	config.innerHTML = `Ainda não tem uma conta? <button type="button" class="auth-switch" id="authSwitch">Criar conta</button>`;
	document.getElementById('authSwitch').onclick = () => renderAuth('register');
};
const authObserver = new MutationObserver(addAuthSwitch);
authObserver.observe(document.getElementById('authRoot'), { childList: true, subtree: true });
addAuthSwitch();

const addAdminAccess = () => {
	const config = document.querySelector('.auth-config');
	if (!config || config.dataset.admin === 'true' || document.getElementById('adminSwitch')) return;
	const adminButton = document.createElement('button');
	adminButton.type = 'button';
	adminButton.id = 'adminSwitch';
	adminButton.className = 'auth-switch auth-admin-switch';
	adminButton.textContent = 'Entrar como proprietário da barbearia';
	config.appendChild(document.createElement('br'));
	config.appendChild(adminButton);
	adminButton.onclick = () => {
		config.dataset.admin = 'true';
		const eyebrow = document.querySelector('.auth-box .eyebrow');
		const heading = document.querySelector('.auth-box h2');
		const description = document.querySelector('.auth-box h2 + p');
		const form = document.getElementById('authForm');
		const submit = form.querySelector('button');
		eyebrow.textContent = 'Área da barbearia';
		heading.textContent = 'Acesso administrativo';
		description.textContent = 'Entre para gerenciar agenda, clientes, financeiro e equipe.';
		submit.textContent = 'Entrar no painel';
		form.dataset.mode = 'admin';
		adminButton.remove();
	};
};
const adminObserver = new MutationObserver(addAdminAccess);
adminObserver.observe(document.getElementById('authRoot'), { childList: true, subtree: true });
addAdminAccess();
</script>
</body>
</html>
